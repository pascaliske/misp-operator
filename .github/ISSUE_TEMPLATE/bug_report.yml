name: Bug Report
description: Report a bug or unexpected behavior.
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the steps required to reproduce the behavior.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      render: shell

  - type: input
    id: version
    attributes:
      label: Operator version
      placeholder: v1.2.3

  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version
      placeholder: v1.31.0

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
